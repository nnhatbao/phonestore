<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 text-center p-4">
        <h4 class="fw-bold text-success mb-3">
          <i class="fa fa-check-circle me-1"></i> Đặt hàng thành công!
        </h4>
        <p class="text-muted text-center mb-3">
          Mã đơn hàng: <strong class="text-danger">#{{ displayOrderCode }}</strong>
        </p>

        <div class="alert alert-info py-2">
          Số tiền thanh toán:
          <span class="fs-4 fw-bold text-danger"> {{ totalAmount | number }} đ </span>
        </div>

        <!-- Khung ảnh QR Code VietQR -->
        <div class="my-4" *ngIf="qrCodeUrl">
          <img
            [src]="qrCodeUrl"
            alt="Mã QR VietQR"
            class="img-fluid border rounded shadow-sm p-2 bg-white"
            style="max-width: 280px"
          />
          <p class="small text-muted mt-2 mb-0">Quét mã bằng app ngân hàng bất kỳ để thanh toán</p>
        </div>

        <div class="d-grid gap-2">
          <a routerLink="/products" class="btn btn-outline-primary">
            <i class="fa fa-arrow-left me-1"></i> Đã thanh toán, tiếp tục mua sắm
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
