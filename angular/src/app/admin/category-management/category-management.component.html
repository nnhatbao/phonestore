<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h4 class="m-0 fw-bold text-primary">
      <i class="fa fa-tags me-2"></i>Quản lý danh mục thương hiệu
    </h4>
    <button class="btn btn-primary" (click)="createCategory()">
      <i class="fa fa-plus me-1"></i> Thêm danh mục
    </button>
  </div>

  <div class="card-body">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th style="width: 80px" class="text-center">STT</th>
          <th>Tên danh mục / Hãng</th>
          <th>Mô tả</th>
          <th class="text-center" style="width: 140px">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of categories.items; let i = index">
          <td class="text-center fw-semibold text-muted">{{ i + 1 }}</td>
          <td class="fw-bold text-dark">{{ item.name }}</td>
          <td>{{ item.description || 'Chưa có mô tả' }}</td>
          <td class="text-center">
            <button
              class="btn btn-sm btn-outline-warning me-2"
              (click)="editCategory(item)"
              title="Sửa"
            >
              <i class="fa fa-pencil"></i>
            </button>
            <button
              class="btn btn-sm btn-outline-danger"
              (click)="deleteCategory(item.id)"
              title="Xóa"
            >
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="categories.items.length === 0">
          <td colspan="4" class="text-center text-muted py-4">
            Chưa có danh mục nào. Hãy bấm "Thêm danh mục"!
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Thêm/Sửa Category -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h4>{{ selectedCategory.id ? 'Cập nhật danh mục' : 'Thêm mới danh mục' }}</h4>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()" id="category-form">
      <div class="mb-3">
        <label class="form-label fw-bold">Tên danh mục (Apple, Samsung,...) *</label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          placeholder="Nhập tên hãng..."
        />
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Mô tả</label>
        <textarea
          class="form-control"
          formControlName="description"
          rows="3"
          placeholder="Mô tả danh mục..."
        ></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>Hủy</button>
    <button type="submit" form="category-form" class="btn btn-primary" [disabled]="form?.invalid">
      <i class="fa fa-check me-1"></i> Lưu lại
    </button>
  </ng-template>
</abp-modal>
